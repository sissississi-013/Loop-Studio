[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loop-studio"
version = "0.1.0"
description = "An open-source, local-first video editing studio with optional model direction"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["Pillow>=10.4,<13"]

[project.scripts]
loop-studio = "loop_studio.server:main"

[tool.setuptools.package-data]
loop_studio = ["web/*"]

[tool.setuptools.packages.find]
include = ["loop_studio*"]
